<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MO GYM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div class="brand">
                <div class="logo">🏋️</div>

                <div>
                    <h1>MO GYM</h1>
                    <small>Train. Track. Grow.</small>
                </div>
            </div>
        </header>

        <!-- Dashboard -->
        <section id="dashboard" class="page active">
            <h2>أهلاً يا محمد 👋</h2>

            <div class="stats">

                <div class="stat">
                    <strong id="streak">0</strong>
                    <small>Streak</small>
                </div>

                <div class="stat">
                    <strong id="workoutCount">0</strong>
                    <small>Workouts</small>
                </div>

                <div class="stat">
                    <strong id="prCount">0</strong>
                    <small>PRs</small>
                </div>

            </div>
        </section>

        <!-- Workout -->
        <section id="workout" class="page">

            <div class="day-tabs">

                <button onclick="changeDay('Torso A')">Torso A</button>

                <button onclick="changeDay('Limbs A')">Limbs A</button>

                <button onclick="changeDay('Torso B')">Torso B</button>

                <button onclick="changeDay('Limbs B')">Limbs B</button>

            </div>

            <div id="exerciseList"></div>

        </section>

        <!-- Progress -->
        <section id="progressPage" class="page">

            <h2>📈 Progress</h2>

            <div id="progressBars"></div>

        </section>

        <!-- History -->
        <section id="historyPage" class="page">

            <h2>📅 History</h2>

            <div id="historyList"></div>

        </section>

    </div>

    <nav class="bottom-nav">

        <button onclick="showPage('dashboard')">🏠</button>

        <button onclick="showPage('workout')">🏋️</button>

        <button onclick="showPage('progressPage')">📈</button>

        <button onclick="showPage('historyPage')">📅</button>

    </nav>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>

</body>
</html>
